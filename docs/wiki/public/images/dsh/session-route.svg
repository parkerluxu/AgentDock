<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 580" role="img" aria-labelledby="title desc">
  <title id="title">DSH 会话与 AgentDock Agent 路由示意图</title>
  <desc id="desc">用户在 DSH 选择 AgentDock Agent 并发送消息，插件把当前会话映射到 AgentDock Session，调用 API 和本机 Runtime，再把结果流回 DSH。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#64748b" stroke-width="2"/></marker>
    <style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:31px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#55647a}</style>
  </defs>
  <rect width="1500" height="580" rx="24" fill="#f3f6fb"/>
  <text x="55" y="67" class="title">一次聊天消息如何到达本机 Agent</text>
  <text x="55" y="103" class="small">模型选择器选的是 AgentDock Agent 路由；不是在 DSH 中配置一份独立模型 API Key。</text>

  <rect x="55" y="158" width="280" height="205" rx="16" fill="#fff" stroke="#38bdf8" stroke-width="2"/>
  <text x="82" y="205" class="head">① DSH 对话</text>
  <text x="82" y="247" class="body">选择 echo-agent</text>
  <text x="82" y="281" class="body">发送一条用户消息</text>
  <text x="82" y="329" class="small">DSH 继续保存 transcript</text>

  <path d="M347 260H405" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="425" y="158" width="300" height="205" rx="16" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="452" y="205" class="head">② 插件建立路由</text>
  <text x="452" y="247" class="body">DSH session ID</text>
  <text x="452" y="281" class="body">→ AgentDock Session</text>
  <text x="452" y="329" class="small">映射记录在 bindingStorePath</text>

  <path d="M737 260H795" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="815" y="158" width="280" height="205" rx="16" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="842" y="205" class="head">③ 本机 API</text>
  <text x="842" y="247" class="body">Bearer Token</text>
  <text x="842" y="281" class="body">127.0.0.1:4177</text>
  <text x="842" y="329" class="small">校验路由并转发任务</text>

  <path d="M1107 260H1165" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1185" y="158" width="260" height="205" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1212" y="205" class="head">④ Agent Runtime</text>
  <text x="1212" y="247" class="body">Echo / Codex / Claude</text>
  <text x="1212" y="281" class="body">执行当前任务</text>
  <text x="1212" y="329" class="small">结果以事件流返回</text>

  <path d="M1320 384V440H190V384" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="275" y="458" width="950" height="67" rx="14" fill="#ccfbf1"/>
  <text x="750" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#115e59">响应回到原 DSH 对话；新的 DSH 会话有自己的绑定，不共享别的会话上下文</text>
</svg>
