<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AgentDock DSH 插件安装与运行流程图</title>
  <desc id="desc">从 AgentDock 源码打包插件，安装到 DSH web profile，再分别启动 AgentDock API 和 DSH Web，最后在聊天模型选择器中选 AgentDock Agent。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#64748b" stroke-width="2"/></marker>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.muted{fill:#55647a}.small{font-size:19px}.body{font-size:22px}.head{font-size:27px;font-weight:700}.num{font-size:20px;font-weight:700;fill:#fff}.terminal{fill:#d1fae5}
    </style>
  </defs>
  <rect width="1600" height="980" rx="26" fill="#f3f6fb"/>
  <text x="64" y="76" font-size="38" font-weight="700">把 AgentDock 接入 DSH Web</text>
  <text x="64" y="116" class="muted" font-size="22">先安装一个本地适配器，再让两个本机进程通过 loopback API 通信</text>

  <rect x="64" y="160" width="445" height="266" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="103" cy="205" r="23" fill="#2563eb"/><text x="103" y="212" text-anchor="middle" class="num">1</text>
  <text x="143" y="214" class="head">在仓库构建并打包</text>
  <text x="96" y="266" class="small muted">AgentDock 源码目录</text>
  <rect x="96" y="286" width="381" height="105" rx="10" fill="#111827"/>
  <text x="116" y="320" class="terminal" font-size="18">npm ci</text>
  <text x="116" y="350" class="terminal" font-size="18">npm run build</text>
  <text x="116" y="380" class="terminal" font-size="18">npm pack --workspace @agentdock/dsh</text>
  <text x="96" y="414" class="small muted">得到本地 agentdock-dsh-*.tgz</text>

  <path d="M520 294H570" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="590" y="160" width="445" height="266" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="629" cy="205" r="23" fill="#7c3aed"/><text x="629" y="212" text-anchor="middle" class="num">2</text>
  <text x="669" y="214" class="head">安装到 DSH profile</text>
  <text x="622" y="266" class="small muted">web profile（不改其他 profile）</text>
  <rect x="622" y="286" width="381" height="105" rx="10" fill="#111827"/>
  <text x="642" y="322" class="terminal" font-size="17">npx @deepseek-ai/dsh plugin</text>
  <text x="642" y="350" class="terminal" font-size="17">  --profile web add -w .\agentdock-dsh-*.tgz</text>
  <text x="642" y="380" class="terminal" font-size="17">npx @deepseek-ai/dsh --profile web --dump-config</text>
  <text x="622" y="414" class="small muted">检查合成配置包含 agentdock-dsh</text>

  <path d="M1046 294H1096" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1116" y="160" width="420" height="266" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="1155" cy="205" r="23" fill="#0f766e"/><text x="1155" y="212" text-anchor="middle" class="num">3</text>
  <text x="1195" y="214" class="head">启动两个本机进程</text>
  <text x="1148" y="266" class="small muted">API 与 DSH 使用同一 Token</text>
  <rect x="1148" y="286" width="356" height="45" rx="9" fill="#e0f2fe"/>
  <text x="1166" y="315" font-size="18" font-weight="700" fill="#075985">终端 A · AgentDock API</text>
  <text x="1166" y="354" class="small">127.0.0.1:4177</text>
  <rect x="1148" y="365" width="356" height="45" rx="9" fill="#ede9fe"/>
  <text x="1166" y="394" font-size="18" font-weight="700" fill="#5b21b6">终端 B · DSH Web + 插件</text>

  <path d="M800 444V496" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="64" y="520" width="1472" height="362" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="570" class="head">运行时：插件只做连接与路由，不替代本机 Agent Runtime</text>

  <rect x="100" y="624" width="360" height="170" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="130" y="670" font-size="24" font-weight="700" fill="#075985">DSH Web 聊天</text>
  <text x="130" y="710" class="body">选择 AgentDock Agent</text>
  <text x="130" y="748" class="small muted">保留 DSH 对话记录</text>

  <path d="M472 710H548" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="570" y="624" width="375" height="170" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="600" y="670" font-size="24" font-weight="700" fill="#5b21b6">AgentDock DSH 插件</text>
  <text x="600" y="710" class="body">读取 Token 环境变量</text>
  <text x="600" y="748" class="small muted">按 DSH 会话选择路由</text>

  <path d="M957 710H1033" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1055" y="624" width="420" height="170" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1085" y="670" font-size="24" font-weight="700" fill="#166534">AgentDock API → Runtime</text>
  <text x="1085" y="710" class="body">Engine · Environment · Permission</text>
  <text x="1085" y="748" class="small muted">Echo 可先验证；真实 CLI 需另行安装</text>

  <rect x="100" y="820" width="1375" height="38" rx="8" fill="#fff7ed"/>
  <text x="120" y="846" font-size="18" fill="#9a3412">安全提示：Token 只通过两个进程各自的环境变量传递；API 仅监听本机 127.0.0.1。</text>
</svg>
